<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Smart Energy Platform</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: wide landing page with rounded colour blocks (teal / orange / navy),
   a working live panel in the middle, chunky display type, floating stat chips. */
:root {
  --teal: #0f5b5c;
  --teal-soft: #4f8a85;
  --green: #5daa86;
  --orange: #ff7a45;
  --amber: #ffa53d;
  --navy: #1a1d3a;
  --slate: #3d4a63;
  --muted: #6b7489;
  --line: #e4e7ec;
  --mist: #f2f4f5;
  --paper: #ffffff;
  --good: #2e9e6b;
  --bad: #e5484d;
  --grad: linear-gradient(135deg, #3f6f78 0%, #4f8f84 55%, #5daa86 100%);
  --grad-orange: linear-gradient(140deg, #ff7a45 0%, #ffa53d 100%);
  --font-display: "Sora", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --radius-xl: 40px;
  --radius-l: 28px;
  --radius-m: 18px;
  color-scheme: light;
}
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body {
  margin: 0; background: var(--paper); color: var(--navy);
  font-family: var(--font-body); font-size: 16px; line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
* { box-sizing: border-box; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: -0.02em; }
p { margin: 0; }
a { color: inherit; }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--orange); outline-offset: 3px; border-radius: 8px; }
.wrap {
  max-width: 1200px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.eyebrow { font-size: 13px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--slate); }
.num { font-variant-numeric: tabular-nums; }

/* ---------- nav ---------- */
.nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: rgba(255,255,255,0.92); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--paper); }
.nav-in { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 14px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 700; font-size: 17px; text-decoration: none; }
.nav-links { display: flex; gap: 28px; }
.nav-links a { text-decoration: none; font-size: 13px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--slate); }
.nav-links a:hover { color: var(--orange); }
.btn { display: inline-flex; align-items: center; gap: 8px; border: 0; border-radius: 999px; padding: 12px 22px; font-weight: 600; text-decoration: none; transition: transform .15s ease, box-shadow .15s ease; }
.btn:hover { transform: translateY(-1px); }
.btn-orange { background: var(--orange); color: var(--paper); box-shadow: 0 8px 20px rgba(255,122,69,.28); }
.btn-ghost { background: var(--mist); color: var(--navy); }
.btn-white { background: var(--paper); color: var(--navy); }
@media (max-width: 820px) { .nav-links { display: none; } }

/* ---------- hero ---------- */
.hero { padding-block: 64px 40px; display: grid; grid-template-columns: 1.05fr 1fr; gap: 48px; align-items: center; }
.hero h1 { font-size: clamp(38px, 6vw, 68px); line-height: 1.04; font-weight: 800; }
.hero h1 em { font-style: normal; color: var(--orange); }
.hero-copy { display: grid; gap: 22px; }
.hero-copy p { font-size: 18px; color: var(--slate); max-width: 52ch; }
.hero-cta { display: flex; flex-wrap: wrap; gap: 12px; }
.hero-art { position: relative; min-height: 440px; }
.tile-orange { position: absolute; inset: 0 0 0 18%; background: var(--grad-orange); border-radius: var(--radius-xl); }
.device { position: absolute; left: 30%; right: 8%; top: 44px; bottom: 0; background: var(--paper); border-radius: 28px 28px 0 0; padding: 22px 22px 0; box-shadow: 0 30px 60px rgba(26,29,58,.18); display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
.device-top { display: flex; justify-content: space-between; align-items: center; color: var(--slate); font-size: 13px; font-weight: 600; }
.device .big { font-family: var(--font-display); font-size: 40px; font-weight: 700; text-align: center; line-height: 1.1; }
.device .big small { font-size: 18px; color: var(--muted); font-weight: 600; }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 12px; font-size: 12px; font-weight: 700; letter-spacing: .04em; }
.pill-good { background: #e3f4ec; color: var(--good); }
.pill-bad { background: #fde4e4; color: var(--bad); }
.pill-neutral { background: var(--mist); color: var(--slate); }
.chip { position: absolute; background: var(--paper); border-radius: 16px; padding: 12px 16px; display: flex; align-items: center; gap: 12px; box-shadow: 0 16px 36px rgba(26,29,58,.14); }
.chip small { display: block; color: var(--muted); font-size: 12px; }
.chip b { font-size: 16px; }
.chip-a { left: 0; top: 96px; }
.chip-b { left: 6%; bottom: 52px; }
.icon-tile { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; color: var(--paper); flex: none; }
.icon-tile.teal { background: var(--grad); }
.icon-tile.orange { background: var(--grad-orange); }
.icon-tile.glass { background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.3); }
@media (max-width: 900px) {
  .hero { grid-template-columns: 1fr; padding-block: 40px 24px; }
  .hero-art { min-height: 400px; }
  .tile-orange { inset: 0 0 0 10%; }
  .device { left: 18%; right: 4%; }
}
@media (max-width: 480px) {
  .chip-a { top: 12px; }
  .chip-b { display: none; }
  .device { left: 14%; right: 2%; top: 70px; }
}

/* ---------- live panel ---------- */
.section { padding-block: 56px; }
.section-head { display: flex; justify-content: space-between; align-items: end; gap: 24px; flex-wrap: wrap; margin-bottom: 28px; }
.section-head h2 { font-size: clamp(30px, 4vw, 46px); font-weight: 800; line-height: 1.08; }
.section-head p { color: var(--slate); max-width: 46ch; }
.grid-live { display: grid; grid-template-columns: repeat(12, 1fr); gap: 20px; }
.card { border-radius: var(--radius-l); padding: 26px; min-width: 0; }
.card-mist { background: var(--mist); }
.card-line { background: var(--paper); border: 1px solid var(--line); }
.card-grad { background: var(--grad); color: var(--paper); }
.card h3 { font-size: 15px; font-weight: 600; font-family: var(--font-body); letter-spacing: .02em; color: inherit; opacity: .85; }
.metric { font-family: var(--font-display); font-size: 46px; font-weight: 700; line-height: 1.1; margin-top: 12px; }
.metric small { font-size: 20px; font-weight: 600; opacity: .7; }
.sub { margin-top: 8px; font-size: 14px; opacity: .8; }
.span-4 { grid-column: span 4; } .span-5 { grid-column: span 5; } .span-7 { grid-column: span 7; } .span-8 { grid-column: span 8; } .span-12 { grid-column: span 12; }
@media (max-width: 980px) { .span-4, .span-5, .span-7, .span-8 { grid-column: span 12; } }
.bar { height: 10px; background: rgba(26,29,58,.08); border-radius: 999px; overflow: hidden; margin-top: 16px; }
.bar i { display: block; height: 100%; border-radius: 999px; background: var(--grad-orange); transition: width .4s ease; }
.bar.over i { background: var(--bad); }
.status-row { display: flex; align-items: center; gap: 14px; margin-top: 14px; }
.status-word { font-family: var(--font-display); font-size: 30px; font-weight: 700; }
.data-note { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--slate); background: var(--mist); border-radius: 999px; padding: 6px 14px; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.chart-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
.legend { display: flex; gap: 16px; font-size: 13px; color: var(--slate); flex-wrap: wrap; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }

/* controls */
.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--mist); border-radius: 999px; padding: 5px; gap: 4px; margin-top: 12px; }
.seg button { border: 0; background: transparent; border-radius: 999px; padding: 10px 6px; font-weight: 600; color: var(--slate); font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--navy); color: var(--paper); }
.ctl { display: grid; gap: 8px; }
.ctl + .ctl { margin-top: 24px; }
.ctl label { font-weight: 600; font-size: 15px; }
.ctl .hint { font-size: 13px; color: var(--muted); }
.range-row { display: flex; align-items: center; gap: 12px; }
input[type="range"] { flex: 1; accent-color: var(--orange); min-width: 0; }
.num-in { width: 96px; border: 1px solid var(--line); border-radius: 12px; padding: 9px 10px; font: inherit; font-variant-numeric: tabular-nums; color: var(--navy); background: var(--paper); }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.switch button { width: 52px; height: 30px; border-radius: 999px; border: 0; background: #cfd5de; position: relative; flex: none; transition: background .2s; }
.switch button::after { content: ""; position: absolute; top: 4px; left: 4px; width: 22px; height: 22px; border-radius: 50%; background: var(--paper); transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
.switch button[aria-checked="true"] { background: var(--teal); }
.switch button[aria-checked="true"]::after { transform: translateX(22px); }
.trip { margin-top: 16px; border-radius: var(--radius-m); background: #fde4e4; color: #a3262a; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-weight: 600; font-size: 14px; }

/* ---------- marquee ---------- */
.marquee { border-block: 1px solid var(--line); overflow: hidden; padding-block: 26px; }
.marquee-track { display: flex; gap: 40px; align-items: center; width: max-content; animation: slide 28s linear infinite; }
.marquee-track span.word { font-family: var(--font-display); font-weight: 700; font-size: clamp(44px, 7vw, 88px); line-height: 1; }
.marquee .icon-tile { width: 84px; height: 84px; border-radius: 24px; }
@keyframes slide { to { transform: translateX(-50%); } }
@media (prefers-reduced-motion: reduce) { .marquee-track { animation: none; } }

/* ---------- how it works ---------- */
.split { display: grid; grid-template-columns: 1fr 1.25fr; border-radius: var(--radius-xl); overflow: hidden; }
.split-left { background: var(--orange); color: var(--paper); padding: 48px 40px; display: grid; gap: 24px; align-content: start; }
.split-left h2 { font-size: clamp(30px, 3.6vw, 44px); line-height: 1.08; font-weight: 800; }
.steps { display: grid; gap: 18px; border-left: 2px solid rgba(255,255,255,.55); padding-left: 22px; }
.steps b { display: block; font-family: var(--font-display); font-size: 18px; }
.steps p { opacity: .92; font-size: 15px; }
.split-right { background: var(--teal); padding: 40px; position: relative; min-height: 420px; display: grid; align-content: center; }
.flow { display: grid; gap: 14px; max-width: 420px; margin: 0 auto; width: 100%; }
.flow-card { background: var(--paper); border-radius: 18px; padding: 14px 18px; display: flex; align-items: center; gap: 14px; box-shadow: 0 12px 28px rgba(0,0,0,.18); }
.flow-card .icon-tile { width: 44px; height: 44px; border-radius: 13px; }
.flow-card b { display: block; font-size: 15px; }
.flow-card small { color: var(--muted); font-size: 13px; }
.flow-arrow { justify-self: center; color: rgba(255,255,255,.7); font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
.float-tiles { position: absolute; top: 24px; right: 24px; display: grid; grid-template-columns: 52px 52px; gap: 0; }
.float-tiles .icon-tile:first-child { grid-column: 2; }
@media (max-width: 900px) { .split { grid-template-columns: 1fr; } .split-left, .split-right { padding: 36px 24px; } .float-tiles { display: none; } }

/* ---------- model ---------- */
.model { background: var(--grad); color: var(--paper); border-radius: var(--radius-xl); padding: 52px 44px; display: grid; grid-template-columns: 1fr 1.1fr; gap: 36px; }
.model h2 { font-size: clamp(30px, 3.8vw, 46px); line-height: 1.08; font-weight: 800; }
.model p { opacity: .92; }
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-top: 28px; }
.stat { background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.22); border-radius: 20px; padding: 16px 18px; }
.stat b { font-family: var(--font-display); font-size: clamp(20px, 2.4vw, 26px); display: block; white-space: nowrap; }
.stat small { opacity: .85; font-size: 13px; }
.model .card { background: var(--paper); color: var(--navy); }
@media (max-width: 900px) { .model { grid-template-columns: 1fr; padding: 36px 22px; } }

/* ---------- faq ---------- */
.faq { display: grid; grid-template-columns: 300px 1fr; gap: 32px; align-items: start; }
.faq-tile { background: var(--grad); color: var(--paper); border-radius: var(--radius-l); padding: 28px; min-height: 180px; display: grid; align-content: space-between; gap: 24px; }
.faq-tile h3 { font-size: 26px; line-height: 1.15; }
.qa { border-bottom: 1px solid var(--line); }
.qa button { width: 100%; text-align: left; border: 0; background: none; padding: 20px 0; display: flex; justify-content: space-between; align-items: center; gap: 16px; font-weight: 600; font-size: 18px; color: var(--navy); }
.qa button span.plus { width: 34px; height: 34px; border-radius: 50%; background: var(--mist); display: grid; place-items: center; flex: none; transition: transform .2s, background .2s; }
.qa button[aria-expanded="true"] span.plus { transform: rotate(45deg); background: var(--orange); color: var(--paper); }
.qa .ans { padding-bottom: 20px; color: var(--slate); max-width: 68ch; }
@media (max-width: 820px) { .faq { grid-template-columns: 1fr; } }

/* ---------- footer ---------- */
footer { margin-top: 40px; }
.foot-band { height: 14px; display: grid; grid-template-columns: 1fr 1.6fr; }
.foot-band i:first-child { background: var(--orange); } .foot-band i:last-child { background: #2f4a6b; }
.foot-top { display: grid; grid-template-columns: 1.2fr 1fr 1fr 1.3fr; gap: 28px; padding-block: 48px 36px; border-bottom: 1px solid var(--line); }
.foot-links { display: grid; gap: 12px; align-content: start; }
.foot-links a { text-decoration: none; font-size: 13px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--slate); }
.foot-links a:hover { color: var(--orange); }
.foot-bottom { display: flex; justify-content: space-between; align-items: end; gap: 24px; flex-wrap: wrap; padding-block: 32px; }
.foot-bottom h3 { font-size: clamp(26px, 3.4vw, 40px); line-height: 1.1; font-weight: 700; }
.tags { display: flex; gap: 10px; flex-wrap: wrap; }
.tags span { border: 1px solid var(--line); border-radius: 12px; padding: 8px 14px; font-weight: 600; font-size: 14px; color: var(--slate); }
.copy { padding-block: 0 28px; font-size: 13px; color: var(--muted); }
@media (max-width: 900px) { .foot-top { grid-template-columns: 1fr 1fr; } }
@media (max-width: 520px) { .foot-top { grid-template-columns: 1fr; } }

/* toast */
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); background: var(--navy); color: var(--paper); padding: 12px 20px; border-radius: 999px; font-weight: 600; font-size: 14px; z-index: 40; box-shadow: 0 12px 30px rgba(26,29,58,.3); }
.boot { padding: 80px 16px; text-align: center; color: var(--slate); }
</style>

</head>
<body>
<div id="root"><p class="boot">Loading Smart Energy…</p></div>

<script src="/static/react.production.min.js"></script>
<script src="/static/react-dom.production.min.js"></script>
<script src="/static/babel.min.js"></script>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;

/* ---------------- helpers ---------------- */
const fmtW = (w) => (w == null || isNaN(w)) ? "–" : (Math.abs(w) < 10 ? w.toFixed(2) : w.toFixed(1));
const hhmm = (t) => (t || "").slice(11, 16);

/* ---------------- icons (simple inline SVG) ---------------- */
const Svg = ({ children, size = 24 }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">{children}</svg>
);
const IBolt = (p) => <Svg {...p}><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z" fill="currentColor" stroke="none" /></Svg>;
const IChart = (p) => <Svg {...p}><path d="M3 17l5-5 4 4 8-9" /><path d="M14 7h6v6" /></Svg>;
const ICheck = (p) => <Svg {...p}><path d="M20 6 9 17l-5-5" /></Svg>;
const IStar = (p) => <Svg {...p}><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z" fill="currentColor" stroke="none" /></Svg>;
const IChip = (p) => <Svg {...p}><rect x="6" y="6" width="12" height="12" rx="2" /><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4" /></Svg>;
const IServer = (p) => <Svg {...p}><rect x="3" y="4" width="18" height="7" rx="2" /><rect x="3" y="13" width="18" height="7" rx="2" /><path d="M7 7.5h.01M7 16.5h.01" /></Svg>;
const IBrain = (p) => <Svg {...p}><circle cx="12" cy="12" r="3" /><path d="M12 2v4M12 18v4M2 12h4M18 12h4M5 5l3 3M16 16l3 3M19 5l-3 3M8 16l-3 3" /></Svg>;
const IPower = (p) => <Svg {...p}><path d="M12 2v10" /><path d="M18.4 6.6a9 9 0 1 1-12.8 0" /></Svg>;
const IArrow = (p) => <Svg {...p}><path d="M7 17 17 7M8 7h9v9" /></Svg>;
const IDown = (p) => <Svg {...p}><path d="M12 5v14M5 12l7 7 7-7" /></Svg>;
const IPlus = (p) => <Svg {...p}><path d="M12 5v14M5 12h14" /></Svg>;

const Logo = () => (
  <svg width="36" height="36" viewBox="0 0 36 36" aria-hidden="true">
    <rect width="36" height="36" rx="11" fill="#0f5b5c" />
    <path d="M20 6 10 20h7l-1.5 10L26 15h-7l1-9z" fill="#ff7a45" />
  </svg>
);

/* ---------------- demo data (used when the backend isn't reachable) ---------------- */
const DEMO_LOAD_W = 1.8;            // 9 V DC load drawing ~0.2 A
const demoOn = (d) => { const h = d.getHours() + d.getMinutes() / 60;
  return (h >= 7 && h < 9) || (h >= 13 && h < 14.5) || (h >= 18 && h < 23); };
function demoPower(d, relayOn = true) {
  if (!relayOn || !demoOn(d)) return 0;
  const n = Math.sin(d.getTime() / 6e5) * 0.04;
  return DEMO_LOAD_W + n;
}
function makeDemo(settings) {
  const now = new Date();
  const relayOn = settings.relay_mode === "on" || (settings.relay_mode === "auto" && !settings.tripped);
  const power = [];
  for (let m = 24 * 60; m >= 0; m -= 5) {
    const d = new Date(now.getTime() - m * 60000);
    const iso = new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
    power.push({ t: iso, w: +demoPower(d, m > 0 || relayOn).toFixed(2) });
  }
  const avg = (a) => a.reduce((s, x) => s + x.w, 0) / Math.max(a.length, 1);
  const typical = avg(power);
  const last = power.slice(-12), prev = power.slice(-24, -12);
  const nextHour = new Date(now.getTime() + 30 * 60000);
  const expected = demoOn(nextHour) ? DEMO_LOAD_W : 0;
  const predicted = Math.max(0, 0.55 * avg(last) + 0.15 * avg(prev) + 0.3 * expected);
  const points = [];
  for (let h = 12; h >= 1; h--) {
    const slice = power.slice(-(h + 1) * 12, -h * 12 || undefined);
    const actual = avg(slice);
    const wobble = Math.sin(h * 1.7) * 0.18;
    points.push({ t: slice[0].t, actual_w: +actual.toFixed(2), predicted_w: +Math.max(0, actual + wobble).toFixed(2) });
  }
  const errs = points.map((p) => p.predicted_w - p.actual_w);
  const mae = errs.reduce((s, e) => s + Math.abs(e), 0) / errs.length;
  const rmse = Math.sqrt(errs.reduce((s, e) => s + e * e, 0) / errs.length);
  const alert = predicted > settings.threshold_w;
  const lastW = relayOn ? demoPower(now, true) : 0;
  return {
    status: {
      online: true,
      last_reading: { ts: power[power.length - 1].t, power_w: lastW, voltage: 9.0, current_a: +(lastW / 9).toFixed(3) },
      prediction: { predicted_w: +predicted.toFixed(2), method: "model", typical_w: +typical.toFixed(2), hours_collected: 24 },
      settings, alert, relay: relayOn ? "on" : "off",
    },
    history: { power, evaluation: { count: points.length, mae_w: +mae.toFixed(2), rmse_w: +rmse.toFixed(2), points } },
  };
}

/* ---------------- data hook: live backend, or demo ---------------- */
function useEnergy() {
  const [mode, setMode] = useState("loading");      // loading | live | demo
  const [status, setStatus] = useState(null);
  const [history, setHistory] = useState(null);
  const demoSettings = useRef({ threshold_w: 1.5, auto_control: true, relay_mode: "auto", tripped: false });

  const loadDemo = useCallback(() => {
    const s = demoSettings.current;
    const d = makeDemo(s);
    if (d.status.alert && s.auto_control && s.relay_mode === "auto" && !s.tripped) {
      s.tripped = true;
      Object.assign(d, makeDemo(s));
      d.status.alert = true;
    }
    setStatus(d.status); setHistory(d.history);
  }, []);

  const loadLive = useCallback(async () => {
    const r = await fetch("/api/status", { cache: "no-store" });
    if (!r.ok) throw new Error("no backend");
    setStatus(await r.json());
  }, []);
  const loadHistory = useCallback(async () => {
    const r = await fetch("/api/history?hours=24", { cache: "no-store" });
    if (r.ok) setHistory(await r.json());
  }, []);

  useEffect(() => {
    let alive = true, t1, t2;
    (async () => {
      try {
        await loadLive(); await loadHistory();
        if (!alive) return;
        setMode("live");
        t1 = setInterval(() => loadLive().catch(() => {}), 5000);
        t2 = setInterval(() => loadHistory().catch(() => {}), 30000);
      } catch (e) {
        if (!alive) return;
        setMode("demo"); loadDemo();
        t1 = setInterval(loadDemo, 5000);
      }
    })();
    return () => { alive = false; clearInterval(t1); clearInterval(t2); };
  }, [loadLive, loadHistory, loadDemo]);

  const update = useCallback(async (body) => {
    if (mode === "live") {
      await fetch("/api/settings", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      await loadLive(); await loadHistory();
    } else {
      const s = demoSettings.current;
      if ("threshold_w" in body) s.threshold_w = Math.max(0, +body.threshold_w);
      if ("auto_control" in body) s.auto_control = !!body.auto_control;
      if (body.relay_mode) s.relay_mode = body.relay_mode;
      if (body.reset_trip) s.tripped = false;
      loadDemo();
    }
  }, [mode, loadLive, loadHistory, loadDemo]);

  return { mode, status, history, update };
}

/* ---------------- charts ---------------- */
function niceMax(v) {
  if (v <= 0) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  const n = v / p;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;
}

function useWidth(initial = 600) {
  const ref = useRef(null);
  const [w, setW] = useState(initial);
  useEffect(() => {
    const el = ref.current;
    if (!el || typeof ResizeObserver === "undefined") return;
    const ro = new ResizeObserver(([e]) => setW(Math.max(240, Math.round(e.contentRect.width))));
    ro.observe(el);
    return () => ro.disconnect();
  }, []);
  return [ref, w];
}

function AreaChart(props) {
  const [ref, w] = useWidth();
  return <div ref={ref}><AreaChartInner {...props} W={w} /></div>;
}

function AreaChartInner({ points, threshold, height = 240, compact = false, W }) {
  const H = height, L = compact ? 8 : 44, R = 16, T = 16, B = compact ? 8 : 28;
  if (!points || points.length < 2) {
    return <div style={{ height: H * 0.6, display: "grid", placeItems: "center", color: "var(--muted)" }}>Waiting for readings…</div>;
  }
  const vals = points.map((p) => p.w);
  const maxY = niceMax(Math.max(...vals, threshold || 0) * 1.1);
  const x = (i) => L + (i / (points.length - 1)) * (W - L - R);
  const y = (v) => T + (1 - v / maxY) * (H - T - B);
  const line = points.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)} ${y(p.w).toFixed(1)}`).join(" ");
  const area = `${line} L${x(points.length - 1)} ${H - B} L${L} ${H - B} Z`;
  const ticks = [0, 0.25, 0.5, 0.75, 1].map((f) => f * maxY);
  const xi = [0, 0.25, 0.5, 0.75, 1].map((f) => Math.round(f * (points.length - 1)));
  const lastI = points.length - 1;
  const gid = compact ? "gA" : "gB";
  return (
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" role="img" aria-label="Power over time">
      <defs>
        <linearGradient id={gid} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="#ff7a45" stopOpacity="0.32" />
          <stop offset="100%" stopColor="#ff7a45" stopOpacity="0" />
        </linearGradient>
      </defs>
      {!compact && ticks.map((v, i) => (
        <g key={i}>
          <line x1={L} x2={W - R} y1={y(v)} y2={y(v)} stroke="#e4e7ec" />
          <text x={L - 8} y={y(v) + 4} textAnchor="end" fontSize="11" fill="#6b7489">{fmtW(v)}</text>
        </g>
      ))}
      {!compact && xi.map((i, k) => (
        <text key={k} x={x(i)} y={H - 8} textAnchor={k === 0 ? "start" : k === 4 ? "end" : "middle"} fontSize="11" fill="#6b7489">{hhmm(points[i].t)}</text>
      ))}
      <path d={area} fill={`url(#${gid})`} />
      <path d={line} fill="none" stroke="#ff7a45" strokeWidth="2.5" strokeLinejoin="round" />
      {threshold > 0 && threshold <= maxY && (
        <g>
          <line x1={L} x2={W - R} y1={y(threshold)} y2={y(threshold)} stroke="#e5484d" strokeDasharray="6 5" strokeWidth="1.5" />
          {!compact && <text x={W - R} y={y(threshold) - 6} textAnchor="end" fontSize="11" fontWeight="600" fill="#e5484d">Limit {fmtW(threshold)} W</text>}
        </g>
      )}
      <circle cx={x(lastI)} cy={y(points[lastI].w)} r="6" fill="#ffffff" stroke="#ff7a45" strokeWidth="3" />
    </svg>
  );
}

function CompareChart(props) {
  const [ref, w] = useWidth();
  return <div ref={ref}><CompareChartInner {...props} W={w} /></div>;
}

function CompareChartInner({ points, W }) {
  const H = 220, L = 44, R = 16, T = 16, B = 28;
  if (!points || points.length < 2) return null;
  const maxY = niceMax(Math.max(...points.flatMap((p) => [p.actual_w, p.predicted_w])) * 1.1);
  const x = (i) => L + (i / (points.length - 1)) * (W - L - R);
  const y = (v) => T + (1 - v / maxY) * (H - T - B);
  const path = (k) => points.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)} ${y(p[k]).toFixed(1)}`).join(" ");
  const ticks = [0, 0.5, 1].map((f) => f * maxY);
  return (
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" role="img" aria-label="Predicted versus actual power">
      {ticks.map((v, i) => (
        <g key={i}>
          <line x1={L} x2={W - R} y1={y(v)} y2={y(v)} stroke="#e4e7ec" />
          <text x={L - 8} y={y(v) + 4} textAnchor="end" fontSize="11" fill="#6b7489">{fmtW(v)}</text>
        </g>
      ))}
      <text x={L} y={H - 8} fontSize="11" fill="#6b7489">{hhmm(points[0].t)}</text>
      <text x={W - R} y={H - 8} textAnchor="end" fontSize="11" fill="#6b7489">{hhmm(points[points.length - 1].t)}</text>
      <path d={path("actual_w")} fill="none" stroke="#1a1d3a" strokeWidth="2.5" />
      <path d={path("predicted_w")} fill="none" stroke="#ff7a45" strokeWidth="2.5" strokeDasharray="7 5" />
      {points.map((p, i) => <circle key={i} cx={x(i)} cy={y(p.actual_w)} r="3" fill="#1a1d3a" />)}
    </svg>
  );
}

function LivePanel({ mode, status, history, update, toast }) {
  const s = status?.settings || {};
  const p = status?.prediction || {};
  const lr = status?.last_reading;
  const [thr, setThr] = useState(s.threshold_w ?? 1.5);
  const loaded = useRef(false);
  useEffect(() => { if (!loaded.current && s.threshold_w != null) { setThr(s.threshold_w); loaded.current = true; } }, [s.threshold_w]);

  const typical = p.typical_w || 1;
  const maxThr = Math.max(niceMax(Math.max(typical * 3, (s.threshold_w || 0) * 1.5, (lr?.power_w || 0) * 1.5)), 1);
  const step = maxThr <= 10 ? 0.05 : maxThr <= 100 ? 0.5 : 5;
  const ratio = p.predicted_w != null && s.threshold_w ? p.predicted_w / s.threshold_w : 0;

  const setModeBtn = async (m) => { await update({ relay_mode: m }); toast(m === "auto" ? "Relay set to Auto" : m === "on" ? "Appliance forced ON" : "Appliance forced OFF"); };
  const save = async () => { await update({ threshold_w: thr }); toast(`Limit saved: ${fmtW(+thr)} W`); };
  const reset = async () => { await update({ reset_trip: true, relay_mode: "auto" }); toast("Trip reset, appliance back ON"); };
  const toggleAuto = async () => { await update({ auto_control: !s.auto_control }); toast(!s.auto_control ? "Auto switch-off turned on" : "Auto switch-off turned off"); };

  return (
    <section className="wrap section" id="live">
      <div className="section-head">
        <div style={{ display: "grid", gap: 12 }}>
          <span className="eyebrow">Live panel</span>
          <h2>Your appliance, right now</h2>
        </div>
        <span className="data-note">
          <span className="dot" style={{ background: mode === "live" ? (status?.online ? "var(--good)" : "var(--bad)") : "var(--amber)" }} />
          {mode === "live" ? (status?.online ? `Device online · last reading ${hhmm(lr?.ts)}` : "Device offline · check the ESP32") : mode === "demo" ? "Demo data · start app.py to see your device" : "Connecting…"}
        </span>
      </div>

      <div className="grid-live">
        <div className="card card-grad span-4">
          <h3>Power now</h3>
          <div className="metric num">{fmtW(lr?.power_w)}<small> W</small></div>
          <div className="sub num">{lr?.voltage != null ? `${lr.voltage} V · ${lr.current_a ?? "–"} A` : "No reading yet"}</div>
          <div style={{ marginTop: 18 }}><span className="pill" style={{ background: "rgba(255,255,255,.2)", color: "#fff" }}><IPower size={14} /> Relay {status?.relay === "off" ? "OFF" : "ON"}</span></div>
        </div>

        <div className="card card-mist span-4">
          <h3>Next hour forecast</h3>
          {p.predicted_w != null ? (
            <>
              <div className="metric num">{fmtW(p.predicted_w)}<small> W</small></div>
              <div className={`bar ${ratio > 1 ? "over" : ""}`}><i style={{ width: `${Math.min(ratio, 1) * 100}%` }} /></div>
              <div className="sub num">{Math.round(ratio * 100)}% of your {fmtW(s.threshold_w)} W limit · {p.method === "model" ? "Random Forest" : p.method}</div>
            </>
          ) : (
            <>
              <div className="metric" style={{ fontSize: 26 }}>Collecting history</div>
              <div className="bar"><i style={{ width: `${Math.min((p.hours_collected || 0) / 3, 1) * 100}%` }} /></div>
              <div className="sub">{p.reason || "Waiting for readings"}</div>
            </>
          )}
        </div>

        <div className="card card-line span-4">
          <h3>Status</h3>
          <div className="status-row">
            <div className={`icon-tile ${status?.alert ? "orange" : "teal"}`}>{status?.alert ? <IBolt /> : <ICheck />}</div>
            <div>
              <div className="status-word" style={{ color: status?.alert ? "var(--bad)" : "var(--good)" }}>{status?.alert ? "High usage" : "Normal"}</div>
              <div className="sub" style={{ marginTop: 0 }}>{status?.alert ? "Forecast is above your limit" : "Forecast is within your limit"}</div>
            </div>
          </div>
          {s.tripped && (
            <div className="trip">
              <span>Switched off by the alert</span>
              <button className="btn btn-white" style={{ padding: "8px 16px" }} onClick={reset}>Reset and turn on</button>
            </div>
          )}
        </div>

        <div className="card card-line span-8">
          <div className="chart-head">
            <h3 style={{ color: "var(--navy)", opacity: 1, fontSize: 18 }}>Last 24 hours</h3>
            <div className="legend"><span><i style={{ background: "var(--orange)" }} />Power (5-min average)</span><span><i style={{ background: "var(--bad)" }} />Your limit</span></div>
          </div>
          <AreaChart points={history?.power} threshold={s.threshold_w} />
        </div>

        <div className="card card-mist span-4">
          <div className="ctl">
            <label>Appliance</label>
            <div className="seg" role="group" aria-label="Relay mode">
              {[["auto", "Auto"], ["on", "Always on"], ["off", "Always off"]].map(([m, l]) => (
                <button key={m} aria-pressed={s.relay_mode === m} onClick={() => setModeBtn(m)}>{l}</button>
              ))}
            </div>
            <span className="hint">Auto switches the appliance off when the forecast crosses your limit.</span>
          </div>
          <div className="ctl">
            <label htmlFor="thr">Usage limit</label>
            <div className="range-row">
              <input id="thr" type="range" min="0" max={maxThr} step={step} value={thr} onChange={(e) => setThr(+e.target.value)} />
              <input id="thr-num" className="num-in" type="number" min="0" step={step} value={thr} onChange={(e) => setThr(+e.target.value)} aria-label="Usage limit in watts" />
            </div>
            <button className="btn btn-orange" onClick={save} style={{ justifySelf: "start" }}>Save limit</button>
          </div>
          <div className="ctl">
            <div className="switch">
              <div><label>Auto switch-off</label><div className="hint">Let alerts turn the relay off</div></div>
              <button role="switch" aria-checked={!!s.auto_control} aria-label="Auto switch-off" onClick={toggleAuto} />
            </div>
          </div>
        </div>
      </div>
    </section>
  );
}

              </>

              <span style={{ color: "var(--muted)", fontSize: 14 }}>CSV downloads appear when the app runs from your laptop.</span>
            )}
          </div>
        </div>
        <div className="foot-bottom">
          <h3>Stay in control of every watt</h3>
          <div className="tags"><span>ESP32</span><span>ACS712</span><span>Flask</span><span>scikit-learn</span><span>React</span></div>
        </div>
        <p className="copy">Team project · Random Forest forecaster trained on the UCI household power dataset</p>
      </div>
    </footer>
  );
}

function App() {
  const { mode, status, history, update } = useEnergy();
  const [msg, setMsg] = useState("");
  const timer = useRef();
  const toast = (m) => { setMsg(m); clearTimeout(timer.current); timer.current = setTimeout(() => setMsg(""), 2600); };
  return (
    <>
      <Nav />
      <main>
        <Hero status={status} history={history} />
        <LivePanel mode={mode} status={status} history={history} update={update} toast={toast} />
        <Marquee />
        <HowItWorks />
        <ModelSection history={history} mode={mode} />
        <Faq />
      </main>
      <Footer mode={mode} />
      {msg && <div className="toast" role="status">{msg}</div>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

</body>
</html>
